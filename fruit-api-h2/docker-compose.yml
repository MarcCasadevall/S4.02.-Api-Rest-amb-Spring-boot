services:
  mysql:
    image: mysql:8.0
    container_name: fruit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: fruit_db
    ports:
      - "3307:3306"

  mongodb:
    image: mongo:7.0
    container_name: fruit-mongodb
    environment:
      MONGO_INITDB_DATABASE: orders_db
    ports:
      - "27017:27017"

  app:
    build: .
    container_name: fruit-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql
      - mongodb